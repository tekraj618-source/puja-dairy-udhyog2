{% extends "base.html" %}{% block title %}eSewa Payment · Puja Dairy Udhyog{% endblock %}{% block content %}<section class="success-page"><span class="eyebrow">Secure checkout</span><h1>Complete payment</h1><p>Order #{{ order.id }}</p><div class="order-id">Total: <strong>Rs. {{ "%.0f"|format(order.total) }}</strong></div><form action="{{ payment_url }}" method="POST" class="payment-form"><input type="hidden" name="amount" value="{{ order.total }}"><input type="hidden" name="tax_amount" value="0"><input type="hidden" name="total_amount" value="{{ order.total }}"><input type="hidden" name="transaction_uuid" value="{{ order.transaction_uuid }}"><input type="hidden" name="product_code" value="{{ product_code }}"><input type="hidden" name="product_service_charge" value="0"><input type="hidden" name="product_delivery_charge" value="0"><input type="hidden" name="success_url" value="{{ success_url }}"><input type="hidden" name="failure_url" value="{{ failure_url }}"><input type="hidden" name="signed_field_names" value="total_amount,transaction_uuid,product_code"><input type="hidden" name="signature" value="{{ signature }}"><button class="btn btn-primary">Continue to eSewa →</button></form></section>{% endblock %}
